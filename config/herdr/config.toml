# Herdr configuration — kept alongside tmux; #48 decided to keep both.
#
# The binary is declared in modules/home/packages.nix and this file is linked
# to ~/.config/herdr/config.toml (modules/home/payloads/shared.nix, ADR 0034).
# herdr writes its logs, session.json, sessions/ and .plugins.lock beside it,
# which is why the declaration names this file and not the directory.
#
# Every setting herdr would otherwise persist for itself is declared here
# instead: it rewrites config.toml in place, and through the link that write
# would land in this repository as an unreviewed change. `herdr server
# reload-config` picks up an edit.

# First-run notification setup. Absent means "show it", and herdr records the
# answer by writing this key back into config.toml — which a read-only copy
# refused (ADR 0026), so the overlay returned every launch with a
# "failed to save onboarding setting: Permission denied (os error 13)" toast.
# Declaring the answer here is the same choice, made where it survives.
onboarding = false

[keys]
# Match the current tmux prefix so muscle memory carries over.
prefix = "ctrl+q"

[ui]
# Auto-copy mouse selections. Keyboard copy uses `prefix+e` (edit_scrollback),
# which opens the pane scrollback in $EDITOR (nvim) for search/yank — herdr has
# no tmux-style keyboard copy-mode.
copy_on_select = true
