name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Every job below is gated on what actually changed, so the test that runs
  # is the one that can fail for the thing that moved (ADR 0022). Gated jobs
  # report as *skipped* rather than being absent, so they still satisfy the
  # required status checks of ADR 0012's ruleset.
  #
  # `config/**` is deliberately NOT closure-affecting. Since ADR 0021 the
  # payloads are placed as working-tree symlinks, so a link target is a path
  # string and editing a config file leaves the closure byte-identical —
  # verified by building before and after an edit. Running the macOS build for
  # those changes rebuilds the same closure, which is why they are tested by
  # content instead.
  changes:
    name: Detect closure-affecting changes
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.gates.outputs.build }}
      zsh: ${{ steps.gates.outputs.zsh }}
      nvim: ${{ steps.gates.outputs.nvim }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Ask each gate's scripts whether the change concerns them
        # A gate runs when any of its scripts' --applies says the changed
        # files are in scope (ADR 0032). The scopes live in the scripts, so
        # hooks, preflight and this job read the same ones.
        #
        # A change to this workflow runs every gate, since it can break any
        # job and is in no script's scope (#112). On a push to main every gate
        # runs anyway (the jobs' own `if`), which keeps the caches warm.
        id: gates
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          all=false
          files=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # --no-renames lists a rename as its deletion and its addition, so
            # the old path's scope counts too.
            mapfile -t files < <(git diff --name-only --no-renames "$BASE...$HEAD")
            printf '%s\n' "${files[@]}"
            if printf '%s\n' "${files[@]}" | grep -qxF .github/workflows/ci.yml; then
              all=true
            fi
          else
            all=true
          fi

          # applies SCRIPT...: 0 if any SCRIPT's --applies answers yes.
          applies() {
            local script rc
            [ "${#files[@]}" -gt 0 ] || return 1
            for script in "$@"; do
              rc=0
              "bin/$script" --applies "${files[@]}" || rc=$?
              case $rc in
                0) return 0 ;;
                1) ;;
                *)
                  echo "::error::$script --applies exited $rc"
                  exit 1
                  ;;
              esac
            done
            return 1
          }

          # gate NAME SCRIPT...
          gate() {
            local name=$1 value=false
            shift
            if $all || applies "$@"; then value=true; fi
            echo "$name: $value"
            echo "$name=$value" >> "$GITHUB_OUTPUT"
          }

          gate build check-flake.sh
          gate zsh check-zsh.sh check-abbr.sh
          gate nvim check-stylua.sh check-nvim.sh check-luals.sh

  flake:
    name: Flake check & system closure build
    runs-on: macos-15
    needs: changes
    # Always build on pushes to main (keeps the Nix cache warm); on PRs,
    # only when the closure can actually change.
    if: github.event_name == 'push' || needs.changes.outputs.build == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            # Both caches on one line each. That is a readability choice and
            # nothing more: a setting whose name carries the `extra-` prefix
            # accumulates rather than replacing, so repeated `extra-substituters`
            # lines would work equally well. An earlier version of this comment
            # asserted the opposite, without checking.
            #
            # Keep prose here free of the names of settings this block does not
            # set. install-nix-action decides whether to add its own defaults by
            # looking for a setting's name *as text* in this value, so a comment
            # merely mentioning one is enough to suppress the default -- which is
            # how a comment-only edit once disabled nix-command and failed the
            # flake check.
            #
            # hypatia-emacs carries the patched Emacs of ADR 0031, which is not
            # in cache.nixos.org -- without it this job builds Emacs from source,
            # AOT pass included, on every closure-affecting PR.
            extra-substituters = https://nix-community.cachix.org https://hypatia-emacs.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= hypatia-emacs.cachix.org-1:01hQJcXQlX0AFv1UpAL7v9zQNhoDT0bJzoNaAzABEzQ=

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-macos: 4G

      - name: Flake check and every host's closure build (never switch)
        # The commands live in the script, which hooks and preflight run too
        # (ADR 0032). No file arguments: CI checks the whole tree.
        run: bin/check-flake.sh

  nix-lint:
    name: Nix format & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: nixfmt, deadnix, statix
        # The commands live in the script, which hooks and preflight run too;
        # this job only supplies the devShell that pins their versions
        # (ADR 0032). No file arguments: CI checks the whole tree.
        run: nix develop --no-update-lock-file -c bin/check-nix.sh

  zsh-syntax:
    name: zsh payload syntax
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.zsh == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        # For the devShell's zsh, and for the abbreviations check below, which
        # loads the payload with the zsh-abbr the machine actually gets — both
        # at the versions flake.lock pins.
        uses: cachix/install-nix-action@v31

      - name: zsh -n
        run: nix develop --no-update-lock-file -c bin/check-zsh.sh

      - name: zsh-abbr abbreviations
        # A step of this job rather than a job of its own: the zsh payload is
        # one gate, and a new job name would have to be added to the ADR 0012
        # ruleset before it could be required.
        #
        # Without --commands: this runner has no docker, tmux or nvim, and only
        # the machine knows what is installed, so `preflight` adds that flag
        # locally. Steps 1-4 of the check are the machine-independent ones.
        run: nix develop --no-update-lock-file -c bin/check-abbr.sh

  nvim-stylua:
    name: nvim stylua
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.nvim == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        # The default devShell: stylua needs no Neovim, so this job never
        # waits on the nvim shell's build.
        uses: cachix/install-nix-action@v31

      - name: stylua --check
        run: nix develop --no-update-lock-file -c bin/check-stylua.sh

  # The two jobs below run in the devShell's nvim shell, whose Neovim is the
  # nightly the machine runs (ADR 0032). It is built against this
  # repository's nixpkgs, so no binary cache carries it: the store is cached
  # per lock instead, and a lock update pays for one build. No garbage
  # collection before the save — nothing roots the shell, so it would all go.
  #
  # Nix comes from nix-quick-install-action here, not install-nix-action: the
  # latter's multi-user store is root's, so restoring the cache into it fails
  # with "Permission denied" on every path, and the job silently rebuilds.
  # The single-user store belongs to the runner's user.
  nvim-check:
    name: nvim headless load check
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.nvim == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-nvim-single-user-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-nvim-single-user-${{ runner.os }}-

      - name: Cache plugins
        # The check restores plugins into the nvim-dev data dir to match
        # lazy-lock.json; cache it so runs after the first are a no-op.
        uses: actions/cache@v5
        with:
          path: ~/.local/share/nvim-dev
          key: nvim-dev-plugins-${{ hashFiles('config/nvim/lazy-lock.json') }}
          restore-keys: nvim-dev-plugins-

      - name: Headless load check
        run: nix develop .#nvim --no-update-lock-file -c bin/check-nvim.sh

  nvim-typecheck:
    name: nvim LuaLS typecheck
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.nvim == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Restore and save Nix store
        # Shares the key with nvim-check, so a warm cache serves both.
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-nvim-single-user-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-nvim-single-user-${{ runner.os }}-

      - name: Cache plugins
        # Shares the key with nvim-check so plugins are installed once.
        uses: actions/cache@v5
        with:
          path: ~/.local/share/nvim-dev
          key: nvim-dev-plugins-${{ hashFiles('config/nvim/lazy-lock.json') }}
          restore-keys: nvim-dev-plugins-

      - name: lua-language-server --check
        run: nix develop .#nvim --no-update-lock-file -c bin/check-luals.sh

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: gitleaks
        # Every commit HEAD reaches: on a pull request that is the merge
        # commit, so the base's history and the branch's commits both.
        run: nix develop --no-update-lock-file -c bin/check-secrets.sh

  hygiene:
    name: Docs & commit hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Nix
        # For the devShell that pins the tools the check scripts run with
        # (ADR 0032). The scripts hold the commands; hooks and preflight run
        # them too. No file arguments: CI checks the whole tree.
        uses: cachix/install-nix-action@v31

      - name: markdownlint
        run: nix develop --no-update-lock-file -c bin/check-markdown.sh

      - name: shellcheck
        run: nix develop --no-update-lock-file -c bin/check-shell.sh

      - name: Stray closing tags
        # An agent's file-writing tool occasionally appends `</content>` to a
        # file it creates. Until now only preflight looked for it.
        run: bin/check-stray-tags.sh

      - name: commitlint
        # On a pull request: the branch's commits, not the merge commit CI
        # checks out, and the title, which becomes the squash commit's subject
        # when the branch has more than one commit. On main: what landed.
        # The title goes through env, never into the script text.
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          nix develop --no-update-lock-file -c bin/check-commits.sh "$BASE" "$HEAD"
          if [ "$EVENT" = pull_request ]; then
            printf '%s\n' "$TITLE" | nix develop --no-update-lock-file -c bin/check-commits.sh --message -
          fi

      # The four checks below each explain themselves in their script, and each
      # reads its scope from the files it guards. They run here, in the
      # always-on job, because what they guard trips no path filter (#89, #91).
      - name: Paths the nvim projection hook depends on still exist
        run: bin/check-nvim-hook-paths.sh

      - name: Payload declaration is one the projector can act on
        run: bin/check-payloads.sh

      - name: Skill tree is sound
        run: bin/check-skills.sh

      - name: Agent guard decides as expected
        run: bin/check-agent-guard.sh

      - name: Plugin pins do not ride along with other changes
        # `:Lazy update` writes config/nvim/lazy-lock.json whenever the editor
        # is asked to update, so the pins land in whatever branch happens to be
        # checked out (#98). flake.lock has ADR 0011 to keep that from
        # happening; this file has nothing, and a lock hunk in a pull request
        # that already touches config/ reads as noise.
        #
        # Only an update *riding along* is reported. Adding or removing a
        # plugin changes the lock too, and legitimately arrives with the Lua
        # change that declares it — so the signal is a diff where the pin set
        # is identical and only commits moved.
        #
        # Reports rather than fails, the trade #94 and #96 both settled on.
        # Updating pins deliberately in a branch that also fixes something is
        # unusual, not wrong, and a gate that refused it would be overruling
        # the author on a judgement it cannot make.
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          lock=config/nvim/lazy-lock.json
          changed=$(git diff --name-only "$BASE...HEAD")
          if ! printf '%s\n' "$changed" | grep -qxF "$lock"; then
            echo "ok: $lock is unchanged"
            exit 0
          fi
          if [ -z "$(printf '%s\n' "$changed" | grep -vxF "$lock" || true)" ]; then
            echo "ok: $lock moves alone"
            exit 0
          fi
          python3 .github/scripts/pins-ride-along.py "$BASE" "$lock"
